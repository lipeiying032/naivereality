name: build

# workflow_dispatch must be registered on the default branch (main).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Server: BoringSSL REALITY seams (SERVER PATCH) + front end + in-process PoCs.
  # ---------------------------------------------------------------------------
  server:
    name: BoringSSL REALITY server + PoCs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone BoringSSL at the pinned tag (0.20260413.0)
        run: |
          git clone --depth 1 https://boringssl.googlesource.com/boringssl
          cd boringssl
          git fetch --depth 1 origin 78f7fbeec98a2fb15acea6f7a9f1def7f2e6d9a0
          git checkout FETCH_HEAD
          git log --oneline -1

      - name: Apply the REALITY server patch
        run: |
          git -C boringssl apply "$GITHUB_WORKSPACE/patches/boringssl-reality-server.patch"
          git -C boringssl diff --stat

      - name: Build libssl / libcrypto
        run: |
          cd boringssl
          cmake -GNinja -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF .
          ninja -C build -j"$(nproc)" ssl crypto

      - name: Build the server-side programs (server patch only)
        run: |
          ONLY_SERVER=1 BSSL_DIR="$GITHUB_WORKSPACE/boringssl" bash server/build.sh "$GITHUB_WORKSPACE/bin"
          ./bin/poc_suspend 2>&1 | tee poc_suspend.log

      - name: Apply the client-side code to the same BoringSSL tree
        run: |
          # poc_end_to_end and poc_client exercise both sides (a REALITY client
          # and a REALITY server in one process), so the client-side seams are
          # added here too. tools/apply_client_code.py is the generator used to
          # produce patches/naiveproxy-reality-client.patch.
          python3 tools/apply_client_code.py "$GITHUB_WORKSPACE/boringssl"
          ninja -C boringssl/build -j"$(nproc)" ssl

      - name: Build all programs (incl. the REALITY client) and run PoC 2
        run: |
          set -o pipefail
          BSSL_DIR="$GITHUB_WORKSPACE/boringssl" bash server/build.sh "$GITHUB_WORKSPACE/bin"
          ./bin/poc_end_to_end 2>&1 | tee poc_end_to_end.log

      - name: Smoke-test the front end over real TCP (REALITY + fallback)
        run: |
          set -o pipefail
          ./bin/genkey > /tmp/keys.txt
          PRIV=$(sed -n 1p /tmp/keys.txt)
          PUB=$(sed -n 2p /tmp/keys.txt)
          SHORT=0102030405060708
          ./bin/poc_mirror_server 18443 > mirror.log 2>&1 &
          sleep 1
          ./bin/reality_server --listen 127.0.0.1:18444 --target 127.0.0.1:18443 \
            --private-key "$PRIV" --short-id "$SHORT" > frontend.log 2>&1 &
          sleep 1
          echo "--- authenticated REALITY client ---"
          ./bin/poc_client 18444 "$PUB" "$SHORT" "ci-smoke" 2>&1 | tee client.log
          grep -q "handshake ok" client.log
          grep -q "ci-smoke" client.log
          echo "--- unauthenticated probe (transparent fallback) ---"
          printf 'probe-through-fallback\n' | timeout 15 openssl s_client \
            -connect 127.0.0.1:18444 -tls1_3 -quiet -servername probe.test > probe.log 2>&1 || true
          grep -q "CN = mirror" probe.log
          grep -q "probe-through-fallback" probe.log
          echo "--- front end log ---"
          cat frontend.log
          grep -q "mirrored ServerHello: yes, 122 bytes" frontend.log
          echo "OK: REALITY handshake + mirror injection + transparent fallback"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-server-linux-x86_64
          path: |
            bin/genkey
            bin/reality_server
            bin/poc_suspend
            bin/poc_end_to_end
            bin/poc_mirror_server
            bin/poc_client
            poc_suspend.log
            poc_end_to_end.log
            client.log
            probe.log
            frontend.log
            mirror.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Client: patch applicability against pinned naiveproxy + build the client's
  # BoringSSL side. A full naiveproxy (Chromium) build is out of scope for a
  # hosted runner; see docs/client-build.md for the recommended path.
  # ---------------------------------------------------------------------------
  client:
    name: naiveproxy client patch (apply + BoringSSL build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the patch against the pinned naiveproxy commit
        run: |
          set -e
          mkdir naiveproxy && cd naiveproxy
          git init -q .
          git remote add origin https://github.com/klzgrad/naiveproxy
          git fetch --depth 1 origin d6ba2a2e55416294bca1ae87499bfb31d94ccd4d
          git checkout -q FETCH_HEAD
          echo "naiveproxy $(git rev-parse --short HEAD)"
          git apply --check "$GITHUB_WORKSPACE/patches/naiveproxy-reality-client.patch"
          echo "OK: client patch applies cleanly"

      - name: Clone BoringSSL at Chromium's pinned revision
        run: |
          git clone --depth 1 https://boringssl.googlesource.com/boringssl boringssl-client
          cd boringssl-client
          git fetch --depth 1 origin ac39ea6853833c1f18fd23614091d11855e71752
          git checkout FETCH_HEAD
          git log --oneline -1

      - name: Apply the client-side BoringSSL patch (-p5)
        run: |
          git -C boringssl-client apply -p5 "$GITHUB_WORKSPACE/patches/boringssl-reality-client.patch"
          git -C boringssl-client diff --stat

      - name: Build libssl (client variant)
        run: |
          cd boringssl-client
          cmake -GNinja -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF .
          ninja -C build -j"$(nproc)" ssl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-client-boringssl-linux-x86_64
          path: |
            boringssl-client/build/libssl.a
            boringssl-client/build/libcrypto.a
          if-no-files-found: warn
